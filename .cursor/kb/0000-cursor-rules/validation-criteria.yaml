validation_criteria:
  frontmatter:
    required_fields:
      - name: "Nom descriptif de la règle"
      - description: "Format: 'VERB quand CONTEXT pour GOAL'"
      - categories: "Liste des catégories pertinentes"
      - glob: "Pattern pour les fichiers concernés"
      - always_apply: "Si la règle s'applique toujours (boolean)"
    
    optional_fields:
      - doc_links: "Liens vers la documentation externe"
      - related_rules: "Autres règles liées"
      - rule_version: "Version de la règle"
  
  structure:
    required_sections:
      kb_references:
        prefix: "↹ kb•"
        minimum: 1
        purpose: "Pointer vers des connaissances externalisées"
        
      cognitive_operations:
        prefix: "↹ Ω•"
        minimum: 1
        purpose: "Définir les processus de raisonnement"
        
      llm_delegation:
        prefix: "↹ LLM•"
        minimum: 1
        purpose: "Structurer la contribution du LLM"
    
    recommended_sections:
      - prefix: "↹ principles•"
        purpose: "Définir les principes fondamentaux"
      - prefix: "↹ constraints•"
        purpose: "Établir les contraintes et limites"
      - prefix: "↹ patterns•"
        purpose: "Recommander des approches"
      - prefix: "↹ anti•"
        purpose: "Décrire ce qu'il faut éviter"
      - prefix: "↹ examples•"
        purpose: "Fournir des exemples concrets"
  
  cognitive_focus:
    criteria:
      - "Processus de raisonnement clairement défini"
      - "Points de décision identifiés"
      - "Emphase sur comment penser, pas juste quoi penser"
      - "Abstraction appropriée (principes vs implémentations)"
  
  knowledge_externalization:
    criteria:
      - "Références explicites à des fichiers externes"
      - "Pas de duplication de connaissances dans la règle"
      - "Organisation logique des références KB"
      - "Formats appropriés selon le type de contenu"
  
  llm_delegation:
    criteria:
      - "Tâches clairement définies pour le LLM"
      - "Contraintes explicites"
      - "Critères de validation fournis"
      - "Structure entrée/sortie bien définie"
  
  semantic_quality:
    criteria:
      - "Densité: information maximale avec mots minimaux"
      - "Précision: terminologie exacte et non ambiguë"
      - "Cohérence: notation uniforme dans toute la règle"
      - "Lisibilité: reste compréhensible malgré la compression"
  
  common_issues:
    naming:
      - "Préfixes de section incorrects ou manquants"
      - "Noms d'opérateurs cognitifs peu descriptifs"
      - "Termes inconsistants entre sections"
    
    structure:
      - "Sections obligatoires manquantes"
      - "Sections mal organisées"
      - "Référencement circulaire ou incomplet"
    
    content:
      - "Mélange de connaissances et logique cognitive"
      - "Instructions LLM vagues ou trop générales"
      - "Processus cognitifs qui sont juste des listes de faits"
      - "Exemples manquants ou peu pertinents" 