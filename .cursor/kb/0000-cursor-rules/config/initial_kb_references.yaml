# Initial Knowledge Base References and Configurations
# Ω_KB = kb_reference_registry
# Version: 1.0.0
# Purpose: Bootstrap configuration for the meta-rule system with KB references

# M.sync_config(Ω_KB) = update_registry_on_system_changes
# Λ.validate(kb_references) = ensure_references_resolvable

version: "1.0.0"
description: "Core KB references configuration for the rule creation orchestrator process"
status: "active"

# Organized reference registry following the hybrid compression model
kb_registry:
  # Core knowledge and principles
  knowledge:
    KB_core_principles:
      id: "@kb/0000-cursor-rules/knowledge/core_principles"
      purpose: "Fundamental axioms and principles for rule creation"
      type: "core_knowledge"
      state: "active"
    
    KB_semantic_language:
      id: "@kb/0000-cursor-rules/knowledge/semantic_language"
      purpose: "Core semantic language definition for Apex .mdc syntax"
      type: "knowledge_source"
      state: "active"
  
  # Templates for various artifacts
  templates:
    KB_doc_templates:
      id: "@kb/0000-cursor-rules/templates/documentation_templates" 
      purpose: "Standard documentation structure templates"
      type: "template"
      state: "active"
    
    KB_rule_templates:
      id: "@kb/0000-cursor-rules/templates/rule_templates"
      purpose: "Core templates for generating rule files"
      type: "template"
      state: "active"
    
    KB_kb_templates:
      id: "@kb/0000-cursor-rules/templates/kb_templates"
      purpose: "Templates for generating KB component files"
      type: "template"
      state: "active"
  
  # Prompt libraries for LLM interactions
  prompts:
    KB_generation_prompts:
      id: "@kb/0000-cursor-rules/prompts/semantic_mdc_generator_prompt"
      purpose: "Prompts for generating .mdc semantic rule files"
      type: "prompt"
      state: "active"
    
    KB_documentation_prompts: 
      id: "@kb/0000-cursor-rules/prompts/documentation_generator_prompt"
      purpose: "Prompts for generating comprehensive documentation"
      type: "prompt"
      state: "active"
  
  # Strategy patterns
  strategies:
    KB_strategy_patterns:
      id: "@kb/0000-cursor-rules/knowledge/strategy_patterns"
      purpose: "Patterns for strategy selection based on complexity"
      type: "strategy"
      state: "active"

# Default configuration parameters for rule creation process
config_parameters:
  Ω.defaults:
    validation_depth: "deep"
    include_examples: true
    max_complexity_threshold: "high"
    auto_request_clarification: true
  
  M.defaults:
    journal_format: "structured_json"
    tracking_verbosity: "detailed"

# Trace and monitor configuration  
Ψ_config:
  log_level: "info"
  monitor_kb_changes: true
  record_generation_metrics: true 